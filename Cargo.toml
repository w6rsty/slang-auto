[workspace]
members = ["crates/slang-sys", "crates/slang"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/w6rsty/slang-auto"
homepage = "https://github.com/w6rsty/slang-auto"
keywords = ["slang", "shader", "spirv", "bindings", "graphics"]
categories = ["graphics", "api-bindings", "compilers"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
